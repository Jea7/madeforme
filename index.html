<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내가 쓰려고 만든</title>
<style>
  :root {
    --paper: #f9f3e8;
    --ink: #130e0a;
    --ink2: #2e2722;
    --rule: #c5bcb1;
    --accent: #144bb7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e0b06;
      --ink: #f1e9e3;
      --ink2: #d2c9c2;
      --rule: #332d25;
      --accent: #77a4f6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    word-break: keep-all;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
  h1, h2 { font-family: "MaruBuri", "Nanum Myeongjo", "AppleMyungjo", serif; font-weight: 400; }
  h1 { font-size: 32px; line-height: 1.25; margin: 0 0 32px; }
  section { border-top: 1px solid var(--rule); padding: 20px 0 4px; }
  h2 { font-size: 23px; line-height: 1.3; margin: 0 0 8px; }
  a { color: var(--accent); text-underline-offset: 3px; }
  ul { list-style: none; margin: 0 0 16px; padding: 0; }
</style>
</head>
<body>
<main>
  <h1>내가 쓰려고 만든</h1>
  <section>
    <h2>스토리 노트</h2>
    <ul>
      <li><a href="storynote/privacy/">개인정보처리방침</a></li>
    </ul>
  </section>
</main>
</body>
</html>
